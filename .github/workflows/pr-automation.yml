name: PR automation

# Calls the org-wide PR workflows in Trianect/.github; see its README.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main] # pr-rebase-open-prs: PRs targeting a pushed branch are rebased onto it

jobs:
  pr-automation:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Trianect/.github/.github/workflows/pr-automation.yml@main
    with:
      pr-rebase-open-prs: true # opt-in: force-pushes rebased PR branches
    secrets:
      PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
